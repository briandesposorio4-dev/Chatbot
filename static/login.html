<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso · La Estación</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Lato',sans-serif;
    background:#0E0E0E;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card {
    background:#161616;
    border:1px solid rgba(201,168,76,0.2);
    border-radius:16px;
    padding:40px 32px;
    width:100%;
    max-width:340px;
    text-align:center;
  }
  .logo { font-size:36px; margin-bottom:16px; }
  h1 {
    font-family:'Playfair Display',serif;
    color:#E8C97A;
    font-size:20px;
    margin-bottom:6px;
  }
  p { color:#7A6E5A; font-size:12px; letter-spacing:1px; text-transform:uppercase; margin-bottom:32px; }
  input {
    width:100%;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(201,168,76,0.2);
    border-radius:10px;
    padding:12px 16px;
    color:#F0EAD6;
    font-family:'Lato',sans-serif;
    font-size:14px;
    outline:none;
    margin-bottom:12px;
    text-align:center;
    letter-spacing:2px;
  }
  input:focus { border-color:rgba(201,168,76,0.5); }
  button {
    width:100%;
    background:linear-gradient(135deg, #C9A84C, #A8832A);
    border:none;
    border-radius:10px;
    padding:12px;
    color:#0E0E0E;
    font-family:'Lato',sans-serif;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    letter-spacing:1px;
    transition:opacity 0.2s;
  }
  button:hover { opacity:0.9; }
  .error { color:#E63946; font-size:12px; margin-top:10px; display:none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🍷</div>
  <h1>Panel de Empleados</h1>
  <p>La Estación de los Porches</p>
  <input type="password" id="pass" placeholder="Contraseña" onkeypress="if(event.key==='Enter')entrar()"/>
  <button onclick="entrar()">ENTRAR</button>
  <div class="error" id="error">Contraseña incorrecta</div>
</div>
<script>
async function entrar() {
  const pass = document.getElementById('pass').value;
  const res = await fetch('/panel/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ password: pass })
  });
  if (res.ok) {
    window.location.href = '/panel/reservas';
  } else {
    document.getElementById('error').style.display = 'block';
    document.getElementById('pass').value = '';
  }
}
</script>
</body>
</html>
