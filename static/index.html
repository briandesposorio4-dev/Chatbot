<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Estación de los Porches</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Lato',sans-serif;
    background:#1a1a1a;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ccc;
    font-size:14px;
  }
  .demo-text { text-align:center; opacity:0.3; }
  .demo-text h1 { font-family:'Playfair Display',serif; font-size:24px; color:#C9A84C; }
  .demo-text p { margin-top:8px; font-size:13px; }

  .chat-trigger {
    position:fixed;
    bottom:24px; right:24px;
    width:58px; height:58px;
    border-radius:50%;
    background:linear-gradient(135deg, #C9A84C, #A8832A);
    border:none; cursor:pointer;
    box-shadow:0 4px 20px rgba(201,168,76,0.4);
    display:flex; align-items:center; justify-content:center;
    font-size:24px;
    transition:transform 0.2s, box-shadow 0.2s;
    z-index:999;
  }
  .chat-trigger:hover {
    transform:scale(1.08);
    box-shadow:0 6px 28px rgba(201,168,76,0.5);
  }
  .chat-trigger .icon-open  { display:block; }
  .chat-trigger .icon-close { display:none; }
  .chat-trigger.abierto .icon-open  { display:none; }
  .chat-trigger.abierto .icon-close { display:block; }

  .chat-window {
    position:fixed;
    bottom:96px; right:24px;
    width:360px;
    height:520px;
    border-radius:16px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 12px 48px rgba(0,0,0,0.6);
    transform:scale(0.85) translateY(20px);
    transform-origin:bottom right;
    opacity:0;
    pointer-events:none;
    transition:transform 0.25s cubic-bezier(.34,1.56,.64,1), opacity 0.2s;
    z-index:998;
  }
  .chat-window.abierto {
    transform:scale(1) translateY(0);
    opacity:1;
    pointer-events:all;
  }

  .header {
    background:linear-gradient(180deg, #1A1208, #1A1A1A);
    padding:14px 16px;
    border-bottom:1px solid rgba(201,168,76,0.2);
    display:flex; align-items:center; gap:12px;
    flex-shrink:0;
  }
  .logo-circle {
    width:38px; height:38px; border-radius:50%;
    border:1.5px solid #C9A84C;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; background:rgba(201,168,76,0.08);
    flex-shrink:0;
  }
  .header-info h1 { font-family:'Playfair Display',serif; font-size:14px; color:#E8C97A; }
  .header-info p  { font-size:10px; color:#8A7D65; letter-spacing:1px; text-transform:uppercase; margin-top:2px; }
  .status-dot {
    width:7px; height:7px; border-radius:50%;
    background:#4CAF50; margin-left:auto;
    box-shadow:0 0 6px rgba(76,175,80,0.6);
    animation:pulse 2s infinite; flex-shrink:0;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  .mensajes {
    flex:1; overflow-y:auto;
    padding:14px 12px;
    display:flex; flex-direction:column; gap:10px;
    background:#0E0E0E;
  }
  .mensajes::-webkit-scrollbar { width:3px; }
  .mensajes::-webkit-scrollbar-thumb { background:rgba(201,168,76,0.2); border-radius:3px; }
  .msg-wrap { display:flex; flex-direction:column; gap:2px; animation:fadeUp 0.25s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .msg-wrap.user { align-items:flex-end; }
  .msg-wrap.bot  { align-items:flex-start; }
  .msg-label { font-size:9px; letter-spacing:1px; text-transform:uppercase; color:#8A7D65; padding:0 4px; }
  .mensaje { max-width:85%; padding:9px 13px; font-size:13px; line-height:1.6; }
  .mensaje.bot {
    background:#1A1A1A; color:#F0EAD6;
    border-radius:2px 12px 12px 12px;
    border-left:2px solid #C9A84C;
  }
  .mensaje.user {
    background:linear-gradient(135deg, #2A1F08, #1E1608);
    color:#E8C97A;
    border-radius:12px 12px 2px 12px;
    border:1px solid rgba(201,168,76,0.3);
  }

  .escribiendo-wrap { padding:0 12px 4px; min-height:20px; background:#0E0E0E; }
  .escribiendo { display:none; align-items:center; gap:6px; color:#8A7D65; font-size:11px; }
  .escribiendo.visible { display:flex; }
  .dots span {
    display:inline-block; width:4px; height:4px;
    background:#C9A84C; border-radius:50%; margin:0 1px;
    animation:bounce 1.2s infinite;
  }
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}

  .chips {
    padding:6px 12px 8px; display:flex; gap:6px;
    flex-wrap:wrap; background:#0E0E0E;
  }
  .chip {
    background:rgba(201,168,76,0.08);
    border:1px solid rgba(201,168,76,0.25);
    color:#E8C97A; font-size:11px; padding:4px 10px;
    border-radius:20px; cursor:pointer;
    transition:background 0.2s; font-family:'Lato',sans-serif;
  }
  .chip:hover { background:rgba(201,168,76,0.18); }

  .input-area {
    background:#161616;
    border-top:1px solid rgba(201,168,76,0.15);
    padding:10px 12px;
    display:flex; gap:8px; align-items:center;
    flex-shrink:0;
  }
  .input-area input {
    flex:1; background:rgba(255,255,255,0.04);
    border:1px solid rgba(201,168,76,0.2);
    border-radius:20px; padding:8px 14px;
    color:#F0EAD6; font-family:'Lato',sans-serif;
    font-size:13px; outline:none;
    transition:border-color 0.2s;
  }
  .input-area input::placeholder { color:#8A7D65; }
  .input-area input:focus { border-color:rgba(201,168,76,0.5); }
  .send-btn {
    width:36px; height:36px; border-radius:50%;
    background:linear-gradient(135deg, #C9A84C, #A8832A);
    border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform 0.15s; flex-shrink:0;
  }
  .send-btn:hover { transform:scale(1.08); }
  .send-btn svg { width:14px; height:14px; fill:#0E0E0E; }

  .footer-label {
    text-align:center; font-size:9px;
    color:rgba(138,125,101,0.35);
    padding:5px; letter-spacing:0.8px;
    background:#161616;
  }

  @media (max-width: 420px) {
    .chat-window { width:calc(100vw - 24px); right:12px; bottom:88px; }
    .chat-trigger { right:12px; bottom:12px; }
  }
</style>
</head>
<body>

<div class="demo-text">
  <h1>La Estación de los Porches</h1>
  <p>Pulsa el botón 🍷 para hacer tu reserva</p>
</div>

<button class="chat-trigger" id="trigger" onclick="toggleChat()">
  <span class="icon-open">🍷</span>
  <span class="icon-close">✕</span>
</button>

<div class="chat-window" id="chatWindow">
  <div class="header">
    <div class="logo-circle">🍷</div>
    <div class="header-info">
      <h1>La Estación de los Porches</h1>
      <p>Asador · Tablao Flamenco</p>
    </div>
    <div class="status-dot"></div>
  </div>

  <div class="mensajes" id="mensajes"></div>

  <div class="escribiendo-wrap">
    <div class="escribiendo" id="escribiendo">
      <div class="dots"><span></span><span></span><span></span></div>
      Escribiendo
    </div>
  </div>

  <div class="chips" id="chips">
    <div class="chip" onclick="enviarChip('Quiero hacer una reserva')">🗓 Reservar</div>
    <div class="chip" onclick="enviarChip('¿Cuál es el horario?')">🕐 Horarios</div>
    <div class="chip" onclick="enviarChip('¿Dónde estáis?')">📍 Ubicación</div>
    <div class="chip" onclick="enviarChip('Cancelar mi reserva')">✕ Cancelar</div>
    <div class="chip" onclick="enviarChip('Modificar mi reserva')">✏️ Modificar</div>
  </div>

  <div class="input-area">
    <input type="text" id="input" placeholder="Escribe tu mensaje..." onkeypress="enterEnviar(event)" autocomplete="off"/>
    <button class="send-btn" onclick="enviar()">
      <svg viewBox="0 0 24 24"><path d="M2 12L22 2L14 22L11 13L2 12Z"/></svg>
    </button>
  </div>
  <div class="footer-label">LA ESTACIÓN DE LOS PORCHES · MADRID</div>
</div>

<script>
let sessionId = null;
let iniciado = false;

function toggleChat() {
  const trigger = document.getElementById('trigger');
  const window_ = document.getElementById('chatWindow');
  trigger.classList.toggle('abierto');
  window_.classList.toggle('abierto');
  if (!iniciado) {
    iniciado = true;
    iniciar();
  }
}

async function iniciar() {
  const res = await fetch('/nueva-sesion');
  const data = await res.json();
  sessionId = data.session_id;
  agregarMensaje('bot', '¡Buenas! Bienvenido a La Estación de los Porches 🍷\nSoy tu asistente de reservas. Puedo ayudarte a reservar mesa, modificar o cancelar una reserva, y consultar horarios.\n¿En qué te puedo ayudar?');
}

function agregarMensaje(tipo, texto) {
  const wrap = document.createElement('div');
  wrap.className = `msg-wrap ${tipo}`;
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = tipo === 'bot' ? 'Asistente' : 'Tú';
  const div = document.createElement('div');
  div.className = `mensaje ${tipo}`;
  div.textContent = texto;
  wrap.appendChild(label);
  wrap.appendChild(div);
  document.getElementById('mensajes').appendChild(wrap);
  document.getElementById('mensajes').scrollTop = 99999;
}

async function enviar() {
  const input = document.getElementById('input');
  const texto = input.value.trim();
  if (!texto) return;
  document.getElementById('chips').style.display = 'none';
  agregarMensaje('user', texto);
  input.value = '';
  document.getElementById('escribiendo').classList.add('visible');
  try {
    const res = await fetch('/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ session_id: sessionId, texto })
    });
    const data = await res.json();
    document.getElementById('escribiendo').classList.remove('visible');
    agregarMensaje('bot', data.respuesta);
  } catch(e) {
    document.getElementById('escribiendo').classList.remove('visible');
    agregarMensaje('bot', 'Lo siento, ha ocurrido un error. Por favor llama al 91 478 60 54.');
  }
}

function enviarChip(texto) {
  document.getElementById('input').value = texto;
  enviar();
}

function enterEnviar(e) { if (e.key === 'Enter') enviar(); }
</script>
</body>
</html>
